version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
  groups:
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 3
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  groups:
    version-updates:
      applies-to: version-updates
      patterns:
      - '*'
  cooldown:
    default-days: 3
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
  groups:
    version-updates:
      applies-to: version-updates
      patterns:
      - '*'
  cooldown:
    default-days: 3
