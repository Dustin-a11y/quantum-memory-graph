[metadata]
name = quantum-memory-graph
version = 1.3.0
description = Quantum-optimized knowledge graph memory for AI agents. Relationship-aware subgraph selection via QAOA.
long_description = file: README.md
long_description_content_type = text/markdown
author = Coinkong (Chef's Attraction)
license = MIT
url = https://github.com/Dustin-a11y/quantum-memory-graph
project_urls =
    Source Code = https://github.com/Dustin-a11y/quantum-memory-graph
    Issue Tracker = https://github.com/Dustin-a11y/quantum-memory-graph/issues
    Benchmark Results = https://github.com/Dustin-a11y/quantum-memory-graph/tree/main/benchmarks
    LongMemEval Submission = https://github.com/xiaowu0162/LongMemEval/issues
keywords = quantum, memory, knowledge-graph, agents, qaoa, ai
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
packages = find:
include_package_data = True
python_requires = >=3.9
# Core stays light on purpose: a Kong Graph *plugin* has to install in seconds on any agent box. The
# heavy stacks live in extras — qiskit in particular is no longer on the production recall path
# (classical greedy is the default; QAOA is opt-in via QMG_RECALL_METHOD).
install_requires =
    networkx>=3.0
    numpy>=1.24.0
    requests>=2.28.0

[options.entry_points]
console_scripts =
    qmg-mcp = quantum_memory_graph.mcp_server:main
    qmg-hermes-install = quantum_memory_graph.hermes_install:main

[options.package_data]
quantum_memory_graph =
    hermes_plugin/*.py
    hermes_plugin/*.yaml

[options.extras_require]
embed =
    sentence-transformers>=2.2.0
serve =
    fastapi>=0.100.0
    uvicorn>=0.20.0
quantum =
    qiskit>=1.0.0
    qiskit-aer>=0.13.0
api =
    fastapi>=0.100.0
    uvicorn>=0.20.0
ibm =
    qiskit-ibm-runtime>=0.20.0
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0
all =
    sentence-transformers>=2.2.0
    fastapi>=0.100.0
    uvicorn>=0.20.0
    qiskit>=1.0.0
    qiskit-aer>=0.13.0
